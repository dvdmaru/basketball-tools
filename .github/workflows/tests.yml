# 最小 quality gate：PR 與 main push 跑回歸測試（2026-07-19 站群共病修正後建，比照 racing/baseball）。
# 測試鎖的行為都屬於「壞了不會在畫面上立刻看見、只會在某天排程默默出錯」那一類：
# 部署 hard gate 的 soft/hard 分野、草稿真下架、日期序列快照的 last-known-good 保護。
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # ⚠️ 這一步不可省略，且版本要與 basketball-daily.yml 保持一致。
      # 2026-08-18 踩過：本 workflow 原本沒裝 markdown，而 scripts/build-articles.py 頂層就
      # `import markdown`。在此之前沒有任何測試 import 過 build-articles.py，所以這個缺口
      # 一直沒被看見——直到 test_season_rollover.py 第一次 import 它，CI 才當場 ModuleNotFoundError。
      # 本機因為裝了 markdown 所以 40 條全綠，是典型的「本機綠、CI 紅」。
      - run: pip install markdown==3.10.2
      - run: python -m unittest discover -s tests -v
